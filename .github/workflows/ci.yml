name: Maestro Deck - Quality verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps webkit
      # Visual references are macOS renders; they run locally (see e2e/visual.spec.ts).
      - run: pnpm test:e2e --grep-invert @visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub frontend dist (required by tauri::generate_context!)
        run: mkdir -p dist && touch dist/index.html

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [frontend-quality, rust-quality]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
