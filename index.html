<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro Deck</title>
    <script>
      // Apply theme before first paint to avoid FOUC. Mirrors lib/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem("maestro-deck.settings");
          var mode = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) mode = parsed.state.theme;
          }
          var dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        font-family:
          "Manrope",
          ui-sans-serif,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      html {
        background: hsl(40 30% 99%);
        color: hsl(222 30% 20%);
      }
      html.dark {
        background: hsl(224 71% 4%);
        color: hsl(213 31% 91%);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(40 30% 99%);
        opacity: 1;
        transition: opacity 200ms ease;
      }
      html.dark #splash {
        background: hsl(224 71% 4%);
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .reveal {
        position: relative;
        overflow: hidden;
        color: hsl(222 30% 20%);
      }
      html.dark #splash .reveal {
        color: #ffffff;
      }
      #splash svg {
        width: 260px;
        height: 65px;
        display: block;
      }
      #splash .reveal::after {
        content: "";
        position: absolute;
        inset: -10% -20%;
        background: hsl(222 30% 20%);
        transform: translateX(-120%);
        animation: reveal-sweep 850ms cubic-bezier(0.4, 0, 0.2, 1) 120ms both;
      }
      html.dark #splash .reveal::after {
        background: #ffffff;
      }
      @keyframes reveal-sweep {
        0% {
          transform: translateX(-120%);
        }
        45%,
        55% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(120%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .reveal::after {
          animation: none;
          display: none;
        }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="splash">
      <div class="reveal">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 1600 400"
          role="img"
          aria-label="Maestro Deck"
          font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"
        >
          <g transform="translate(40, 40) scale(0.3125)">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              fill="currentColor"
              d="M256 64C150.02 64 64 150.02 64 256V768C64 873.98 150.02 960 256 960H768C873.98 960 960 873.98 960 768V256C960 150.02 873.98 64 768 64H256ZM320 256C284.654 256 256 284.654 256 320V704C256 739.346 284.654 768 320 768H704C739.346 768 768 739.346 768 704V320C768 284.654 739.346 256 704 256H320Z"
            />
            <rect x="336" y="336" width="352" height="352" rx="24" ry="24" fill="currentColor" />
          </g>
          <text
            x="420"
            y="200"
            dominant-baseline="central"
            font-size="180"
            font-weight="700"
            fill="currentColor"
            letter-spacing="-4"
          >
            Maestro Deck
          </text>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
