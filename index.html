<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro Deck</title>
    <script>
      // Apply theme before first paint to avoid FOUC. Mirrors lib/theme.ts.
      (function () {
        try {
          var raw = localStorage.getItem("maestro-deck.settings");
          var mode = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) mode = parsed.state.theme;
          }
          var dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        font-family:
          "Inter Variable",
          Inter,
          ui-sans-serif,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      /* Mirrors the --background tokens in globals.css. */
      html {
        background: #fbfaf5;
        color: #101013;
      }
      html.dark {
        background: #101013;
        color: #fafaf4;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #fbfaf5;
        opacity: 1;
        transition: opacity 200ms ease;
      }
      html.dark #splash {
        background: #101013;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      /* The pixel icon builds up band by band, top to bottom, in hard steps. */
      #splash svg {
        width: 96px;
        height: 96px;
        display: block;
        clip-path: inset(0 0 100% 0);
        animation: pixel-build 640ms steps(8, end) 80ms forwards;
      }
      @keyframes pixel-build {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      /* Loader under the mark: an orange block running along a hairline
         track in hard steps (the landing's CI bar), then the status line. */
      #splash .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: loader-in 1ms linear 400ms forwards;
      }
      @keyframes loader-in {
        to {
          opacity: 1;
        }
      }
      #splash .track {
        position: relative;
        width: 120px;
        height: 4px;
        overflow: hidden;
        background: #e8e5dc;
      }
      html.dark #splash .track {
        background: #1a1a1e;
      }
      #splash .track::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 30px;
        background: #fa500f;
        animation: loader-run 1.2s steps(6, end) infinite;
      }
      @keyframes loader-run {
        from {
          transform: translateX(-30px);
        }
        to {
          transform: translateX(120px);
        }
      }
      #splash .status {
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #6b6b73;
      }
      html.dark #splash .status {
        color: #a1a1aa;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
          clip-path: none;
        }
        #splash .loader {
          animation: none;
          opacity: 1;
        }
        #splash .track::after {
          animation: none;
          width: 40%;
        }
      }
    </style>
  </head>

    <script>
      // The native window starts hidden (tauri.conf.json `visible: false`) at
      // its final size; show and maximize it as soon as this splash exists so
      // it appears once, already full-size, instead of 1400×900 then
      // maximized. Rust shows it after 3 s if this never runs.
      (function () {
        var tauri = window.__TAURI_INTERNALS__;
        if (!tauri || !tauri.invoke) return;
        tauri
          .invoke("plugin:window|show", { label: "main" })
          .then(function () {
            return tauri.invoke("plugin:window|maximize", { label: "main" });
          })
          .catch(function () {});
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
